<!-- ion-header dihilangkan untuk diganti dengan layout custom -->
<ion-content [fullscreen]="true">
  <!-- Kontainer utama untuk layout flex (sidebar + konten) -->
  <div class="dashboard-container">

    <!-- Kolom 1: Sidebar Navigasi -->
    <div class="sidebar">
      <div class="sidebar-top">
        <h1 class="logo">e-Lelangku</h1>
        <ul class="nav-list">
          <!-- Item 'Dashboard' aktif -->
          <li class="nav-item active">
            <ion-icon name="grid-outline"></ion-icon>
            <span>Dashboard</span>
          </li>
        </ul>
      </div>
      <div class="sidebar-bottom">
        <!-- Tombol logout -->
        <div class="logout-button" (click)="logout()">
          <ion-icon name="log-out-outline"></ion-icon>
          <span>Logout</span>
        </div>
      </div>
    </div>

    <!-- Kolom 2: Konten Utama -->
    <div class="main-content">
      <!-- Header Selamat Datang -->
      <div class="welcome-header">
        <h1>Selamat Datang, {{ userName }}!</h1>
        <p>Apa yang ingin Anda lakukan hari ini?</p>
      </div>

      <!-- Kontainer untuk kartu-kartu menu -->
      <div class="cards-container">

        <!-- Kartu 1: Akses Tender -->
        <div class="action-card" (click)="goTo('akses-tender')">
          <div class="card-icon-wrapper" style="--icon-bg: #3b82f6;">
            <ion-icon name="search-outline"></ion-icon>
          </div>
          <h2 class="card-title">Akses Tender</h2>
          <p class="card-subtitle">Lihat semua tender yang terbuka</p>
        </div>

        <!-- Kartu 2: Jadwal Aanwijzing -->
        <div class="action-card" (click)="goTo('jadwal-aanwijzing')">
          <div class="card-icon-wrapper" style="--icon-bg: #f97316;">
            <ion-icon name="calendar-outline"></ion-icon>
          </div>
          <h2 class="card-title">Jadwal Aanwijzing</h2>
          <p class="card-subtitle">Lihat jadwal sesi penjelasan</p>
        </div>

        <!-- Kartu 3: Pemenang & PO -->
        <div class="action-card" (click)="goTo('pemenang-po')">
          <div class="card-icon-wrapper" style="--icon-bg: #16a34a;">
            <ion-icon name="ribbon-outline"></ion-icon>
          </div>
          <h2 class="card-title">Pemenang & PO</h2>
          <p class="card-subtitle">Lihat notifikasi & Purchase Order</p>
        </div>

      </div>
    </div>
  </div>
</ion-content>
