<ion-content>
  <div class="auth-container">
    
    <!-- Bagian Header -->
    <div class="auth-header fade-in-down">
      <h2>Selamat Datang Kembali</h2>
      <p>Silakan masuk untuk melanjutkan.</p>
    </div>

    <!-- Segment untuk Pindah Halaman -->
    <ion-segment value="login" class="auth-segment fade-in-down" style="animation-delay: 0.1s;">
      <!-- PERBAIKAN: (click) handler dihapus karena tidak diperlukan & menyebabkan error -->
      <ion-segment-button value="login">
        <ion-label>Login</ion-label>
      </ion-segment-button>
      <ion-segment-button value="register" (click)="goToRegister()">
        <ion-label>Register</ion-label>
      </ion-segment-button>
    </ion-segment>

    <!-- Form Input -->
    <div class="form-container fade-in-up" style="animation-delay: 0.2s;">
      <ion-item lines="none">
        <ion-label position="stacked">Alamat E-mail</ion-label>
        <ion-input [(ngModel)]="credentials.email" type="email" placeholder="contoh@email.com"></ion-input>
      </ion-item>

      <ion-item lines="none">
        <ion-label position="stacked">Password</ion-label>
        <ion-input [(ngModel)]="credentials.password" type="password" placeholder="••••••••"></ion-input>
      </ion-item>
    </div>

    <!-- Opsi Lupa Password -->
    <div class="extra-options fade-in-up" style="animation-delay: 0.25s;">
      <ion-text (click)="goToForgotPassword()">
        Lupa Password?
      </ion-text>
    </div>

    <!-- Tombol Aksi -->
    <ion-button class="main-button fade-in-up" expand="block" (click)="onLogin()" style="animation-delay: 0.3s;">
      Login
    </ion-button>

  </div>
</ion-content>
