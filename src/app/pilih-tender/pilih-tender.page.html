<ion-header>
  <ion-toolbar color="primary">
    <ion-buttons slot="start">
      <ion-back-button defaultHref="/halamanutama"></ion-back-button>
    </ion-buttons>
    <ion-title>Pilih Tender</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
  <ion-list-header>Tender Siap untuk Penetapan</ion-list-header>
  <p class="ion-padding-start ion-padding-end">Pilih salah satu tender di bawah ini untuk menetapkan pemenangnya.</p>
  
  <!-- Tampilkan spinner saat loading -->
  <div *ngIf="isLoading" class="ion-text-center ion-padding">
    <ion-spinner></ion-spinner>
  </div>

  <!-- Tampilkan daftar jika tidak loading -->
  <div *ngIf="!isLoading">
    <!-- Cek jika ada tender aktif -->
    <ion-list *ngIf="activeTenders.length > 0; else noActiveTenders">
      <ion-item *ngFor="let tender of activeTenders" 
                [routerLink]="['/penetapan-pemenang-po', tender.id]" 
                detail="true">
        <ion-icon name="document-text-outline" slot="start" color="primary"></ion-icon>
        <ion-label>
          <h2>{{ tender.title }}</h2>
          <p>Status: {{ tender.status }} | Batas Akhir: {{ tender.submission_deadline | date }}</p>
        </ion-label>
      </ion-item>
    </ion-list>

    <!-- Template jika tidak ada tender aktif -->
    <ng-template #noActiveTenders>
      <div class="ion-text-center ion-padding">
        <ion-icon name="file-tray-outline" size="large"></ion-icon>
        <p>Tidak ada tender aktif yang siap untuk penetapan pemenang saat ini.</p>
      </div>
    </ng-template>
  </div>
</ion-content>
