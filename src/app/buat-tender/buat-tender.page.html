<!-- ion-header dihilangkan untuk digantikan dengan layout custom -->

<ion-content>
  <!-- Latar belakang halaman ini akan menjadi cream -->
  
  <!-- Tombol kembali manual agar navigasi tetap ada -->
  <div class="back-button-area">
    <ion-back-button defaultHref="/kelola-pengadaan" text="" icon="arrow-back-outline"></ion-back-button>
  </div>

  <!-- Kontainer utama untuk form -->
  <div class="form-container">
    
    <!-- Judul Utama Halaman -->
    <h1 class="main-title">Buat Tender</h1>
    <p class="section-subtitle">Untuk Pengajuan: <strong>{{ requestTitle }}</strong></p>

    <!-- Grup Form 1: Judul Tender -->
    <div class="form-group">
      <ion-label class="form-label">Judul Tender</ion-label>
      <ion-input
        class="custom-input"
        [(ngModel)]="tender.title"
        placeholder="cth: Pengadaan Alat Tulis Kantor">
      </ion-input>
    </div>

    <!-- Grup Form 2: Deskripsi Tender -->
    <div class="form-group">
      <ion-label class="form-label">Deskripsi Tender</ion-label>
      <ion-textarea
        class="custom-textarea"
        [(ngModel)]="tender.description"
        placeholder="Jelaskan spesifikasi, volume, dan syarat lainnya..."
        [autoGrow]="true">
      </ion-textarea>
    </div>

    <!-- Grup Form 3: Batas Akhir Penawaran -->
    <div class="form-group">
      <ion-label class="form-label">Batas Akhir Penawaran</ion-label>
      <!-- Tombol ini akan membuka modal kalender -->
      <ion-datetime-button datetime="deadline" class="custom-datetime-button"></ion-datetime-button>
    </div>

    <!-- Modal untuk Kalender (tidak terlihat langsung) -->
    <ion-modal [keepContentsMounted]="true">
      <ng-template>
        <ion-datetime
          id="deadline"
          [(ngModel)]="tender.submission_deadline"
          presentation="date-time"
          showDefaultButtons="true"
          doneText="Pilih"
          cancelText="Batal">
        </ion-datetime>
      </ng-template>
    </ion-modal>

    <!-- Tombol Aksi: Publikasikan Tender -->
    <ion-button expand="block" (click)="publishTender()" class="publish-button">
      <ion-icon name="paper-plane-outline" slot="start"></ion-icon>
      Publikasikan Tender
    </ion-button>
  </div>
</ion-content>
