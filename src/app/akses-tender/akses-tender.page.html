<ion-content>
  <ion-refresher slot="fixed" (ionRefresh)="loadTenders($event)">
    <ion-refresher-content></ion-refresher-content>
  </ion-refresher>

  <div class="back-button-area">
    <ion-back-button defaultHref="/halaman-utama-vendor" text="" icon="arrow-back-outline"></ion-back-button>
  </div>

  <div class="mobile-frame">
    
    <h1 class="main-title">Akses Tender</h1>
    <h2 class="section-title">Daftar Tender Aktif</h2>

    <div *ngIf="!isLoading && tenders.length === 0" class="empty-state">
      <ion-icon name="file-tray-outline"></ion-icon>
      <h3>Tidak Ada Tender</h3>
      <p>Saat ini belum ada tender yang dibuka.</p>
    </div>

    <div class="tender-list-container" *ngIf="tenders.length > 0">
      <div *ngFor="let tender of tenders" class="tender-item-card" (click)="viewTender(tender)" button>
        
        <ion-icon name="document-text-outline" class="item-icon"></ion-icon>
        
        <div class="tender-title-group">
          <span class="tender-label">Tender</span>
          <h3 class="tender-title">{{ tender.title }}</h3>
          <p class="tender-deadline">Tenggat: {{ tender.submission_deadline | date:'dd/MM/yyyy' }}</p>
        </div>

        <ion-icon name="chevron-forward-outline" class="chevron-icon"></ion-icon>

      </div>
    </div>
  </div>
</ion-content>
