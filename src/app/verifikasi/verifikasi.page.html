<ion-content class="ion-padding halaman-verifikasi">
  <ion-refresher slot="fixed" (ionRefresh)="loadRequests($event)">
    <ion-refresher-content></ion-refresher-content>
  </ion-refresher>

  <h1 class="main-title">Verifikasi Pengajuan</h1>

  <div class="verification-list-container">

    <div *ngIf="!isLoading && requests.length === 0" class="empty-state">
      <p>Tidak ada pengajuan yang perlu diverifikasi saat ini.</p>
    </div>

    <div *ngFor="let req of requests" class="verification-card">
      
      <div class="card-content">
        <ion-icon name="cube-outline" class="card-icon"></ion-icon>
        <p class="card-title">{{ req.title }}</p>
      </div>

      <div class="action-buttons">
        <ion-button expand="block" class="reject-button" (click)="promptReject(req)">
          <ion-icon slot="start" name="close-outline"></ion-icon>
          Tolak
        </ion-button>
        <ion-button expand="block" class="approve-button" (click)="promptApprove(req)">
          <ion-icon slot="start" name="checkmark-outline"></ion-icon>
          Setujui
        </ion-button>
      </div>
    </div>

  </div>
</ion-content>
