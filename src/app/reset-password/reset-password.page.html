<ion-header class="ion-no-border">
  <ion-toolbar>
    <!-- Tidak ada tombol kembali karena ini diakses dari link eksternal -->
  </ion-toolbar>
</ion-header>

<ion-content>
  <div class="auth-container">
    
    <!-- Bagian Header -->
    <div class="auth-header fade-in-down">
      <h2>Atur Ulang Password</h2>
      <p>Silakan masukkan password baru Anda di bawah ini.</p>
    </div>

    <!-- Form Input -->
    <form (ngSubmit)="submitReset()" class="fade-in-up" style="animation-delay: 0.2s;">
      <div class="form-container">
        <ion-item lines="none">
          <ion-label position="stacked">Alamat E-mail</ion-label>
          <!-- Email diisi otomatis dari URL dan tidak bisa diubah -->
          <ion-input [(ngModel)]="resetData.email" name="email" type="email" [readonly]="true" class="readonly-input"></ion-input>
        </ion-item>

        <ion-item lines="none">
          <ion-label position="stacked">Password Baru</ion-label>
          <ion-input [(ngModel)]="resetData.password" name="password" type="password" placeholder="Minimal 8 karakter" required></ion-input>
        </ion-item>

        <ion-item lines="none">
          <ion-label position="stacked">Konfirmasi Password</ion-label>
          <ion-input [(ngModel)]="resetData.password_confirmation" name="password_confirmation" type="password" placeholder="Ulangi password" required></ion-input>
        </ion-item>
      </div>

      <!-- Tampilkan pesan error jika ada -->
      <ion-text color="danger" *ngIf="errorMessage">
        <p class="error-message">{{ errorMessage }}</p>
      </ion-text>

      <!-- Tombol Aksi -->
      <ion-button class="main-button fade-in-up" expand="block" type="submit" [disabled]="isLoading" style="animation-delay: 0.3s;">
        <ion-spinner *ngIf="isLoading" name="crescent"></ion-spinner>
        <span *ngIf="!isLoading">Simpan Password</span>
      </ion-button>
    </form>

  </div>
</ion-content>
